<article class="card" data-id="{{ link.id }}" data-url="{{ link.url }}">
  <span class="card__punch" aria-hidden="true"></span>

  <header class="card__head">
    <span class="card__call">{{ link.category[:3]|upper }} · {{ '%04d'|format(link.id) }}</span>
    <span class="card__stamp">{{ link.date_added|shortdate }}</span>
  </header>

  <h2 class="card__title">
    <a href="{{ link.url }}" target="_blank" rel="noopener noreferrer">
      {% if link.favicon %}
      <img class="card__favicon" src="{{ link.favicon }}" alt="" width="16" height="16" loading="lazy"
           onerror="this.style.display='none'">
      {% endif %}
      {{ link.title }}
    </a>
  </h2>

  <p class="card__domain">{{ link.url|domain }}</p>
  <p class="card__summary">{{ link.summary }}</p>

  <p class="card__tags">
    {% for tag in link.tag_list %}
    <a class="chip chip--sm" href="{{ url_for('pages.home', tag=tag) }}">{{ tag }}</a>
    {% endfor %}
  </p>

  <footer class="card__foot">
    <a class="card__category" href="{{ url_for('pages.home', category=link.category) }}">{{ link.category }}</a>
    <span class="card__tools">
      <button class="tool" type="button" data-action="edit"
              data-title="{{ link.title }}"
              data-summary="{{ link.summary }}"
              data-category="{{ link.category }}"
              data-tags="{{ link.tags }}">Edit</button>
      <button class="tool" type="button" data-action="refresh">Re-read</button>
      <button class="tool tool--danger" type="button" data-action="delete">Delete</button>
    </span>
  </footer>
</article>
